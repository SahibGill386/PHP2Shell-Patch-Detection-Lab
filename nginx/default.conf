# key=value access log so Splunk pulls the fields out on its own
log_format lab 'src=$remote_addr method=$request_method uri="$request_uri" '
               'status=$status req_len=$request_length ua="$http_user_agent"';

server {
    listen 80;
    root /var/www/html;
    index index.php;

    access_log /var/log/nginx/access.log lab;
    error_log  /var/log/nginx/error.log warn;

    # STOPGAP 1: cap request body size at the edge.
    # Baseline is 64m so the test request gets logged. Change to 8m in step 5.
    client_max_body_size 64m;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php:9000;
    }
}
